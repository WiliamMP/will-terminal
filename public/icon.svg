<!-- Source of the app icon (same style as will-repo). Regenerate every size with: npx tauri icon public/icon.svg -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9478ff" />
      <stop offset="1" stop-color="#5b36f0" />
    </linearGradient>
    <radialGradient id="shine" cx="0.3" cy="0.2" r="0.8">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.5" result="b" />
      <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="208" fill="url(#bg)" />
  <rect x="64" y="64" width="896" height="896" rx="208" fill="url(#shine)" />
  <!-- lucide terminal, scaled from its 24x24 grid -->
  <g transform="translate(176 176) scale(28)" fill="none" stroke="#ffffff" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <path d="m4 17 6-6-6-6" />
    <path d="M12 19h8" />
  </g>
</svg>
